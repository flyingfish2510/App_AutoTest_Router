logging:
  level: "INFO"
  console_enabled: true
  file_enabled: true
  file_naming:
    prefix: "app"
    time_format: "%Y-%m-%d"
    suffix: ".log"
    include_pid: false
    include_env: true
    separator: "_"
  # ✅ 直接写相对路径即可，代码会自动拼接为绝对路径
  log_dir: "logs"
  rotation: "00:00"
  retention: "30 days"
  compression: "zip"
  format:
    console: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
    file: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} - {message}"
  diagnose: true
  backtrace: true
  environment: "development"